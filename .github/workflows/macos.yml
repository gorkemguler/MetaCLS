name: macOS desktop

on:
  pull_request:
    paths:
      - 'platform/macos/**'
      - 'src/**'
      - 'pyproject.toml'
      - '.github/workflows/macos.yml'
  push:
    tags: ['v*', 'macos-v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: python -m pip install . -r platform/macos/requirements-build.txt
      - name: Build and smoke-test portable app
        env:
          PYTHON: python
        run: platform/macos/build-drop-app.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
            dist/macos/*.sha256
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: macos-*
          merge-multiple: true
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
          # Desktop-only tags do not publish a new Python package.
          prerelease: ${{ startsWith(github.ref_name, 'macos-v') }}
          generate_release_notes: true
